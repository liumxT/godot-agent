name: CI

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**", "hotfix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e "apps/backend[dev]"

      - name: Run E0 checks
        run: .venv/bin/python scripts/testing/check_all.py

      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: artifacts/
          if-no-files-found: warn

  godot:
    name: Godot plugin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.5.1
        run: |
          curl -fsSL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.5.1-stable_linux.x86_64 godot
          chmod +x godot

      - name: Load plugin in headless editor
        run: ./godot --headless --path apps/godot-plugin --editor --quit

      - name: Run contracts probe
        run: ./godot --headless --path apps/godot-plugin --editor --quit-after 600 -- --contract-test
